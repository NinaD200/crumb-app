'use strict';const KEY='crumb.recipes.v1';const CATS=['Dinner','Baking','Breakfast','Desserts','Snacks','Lunch','Drinks','Other'];let recipes=[],view='home',filter='All',query='',editing=null,detail=null,selectedCover=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');recipes=Array.isArray(x)?x:[]}catch{recipes=[];toast('Could not load saved recipes.')}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(recipes));return true}catch{toast('Storage is full or unavailable. Export a backup.');return false}}function navigate(v){view=v;editing=null;detail=null;selectedCover=null;render();window.scrollTo(0,0)}function categories(){return ['All',...CATS,'Want to try','Made it']}function card(r){return `<article class="recipe"><div class="photo">${r.image?`<img src="${esc(r.image)}" alt="${esc(r.title)}" loading="lazy">`:'🍽️'}</div><div class="recipe-content"><div class="category">${esc(r.category)}</div><h3>${esc(r.title)}</h3><div class="tiny">◷ ${esc(r.time||'Time not set')} · ${r.status==='made'?'✓ Made it':'Want to try'}</div><div class="actions"><button class="secondary small" data-action="open" data-id="${esc(r.id)}">View</button><button class="secondary small" data-action="favorite" data-id="${esc(r.id)}" aria-label="Toggle favorite">${r.favorite?'♥':'♡'}</button></div></div></article>`}function home(){let arr=recipes.filter(r=>(filter==='All'||filter==='Want to try'&&r.status!=='made'||filter==='Made it'&&r.status==='made'||r.category===filter)&&(r.title+' '+r.ingredients.join(' ')+' '+r.tags).toLowerCase().includes(query.toLowerCase()));return `<div class="eyebrow">My kitchen · Recipe collection</div><h1 class="hero">What are we cooking today?</h1><div class="muted">A little inspiration for your next meal.</div><input id="search" class="search" placeholder="Search recipes or ingredients..." value="${esc(query)}" aria-label="Search recipes"><div class="between"><strong>My collection</strong><span class="tiny">${recipes.length} recipes</span></div><div class="chips">${categories().map(c=>`<button class="chip ${filter===c?'active':''}" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div>${arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:`<div class="empty">No recipes here yet.<p>Tap Add recipe to save your first one.</p></div>`}`}
function form(){let r=recipes.find(x=>x.id===editing)||{};return `<button class="topback" data-action="back">← Back</button><h1 class="hero">${editing?'Edit recipe':'Add a recipe'}</h1><p class="muted">Keep your favorite recipes in one cozy place.</p><section class="importbox" aria-label="Screenshot recipe import"><h3>📸 Import from screenshots</h3><p class="muted">Upload screenshots of the Instagram caption or recipe video. Crumb reads visible text on your device, then suggests ingredients and steps for you to review.</p><label for="ocrFiles"><strong>Choose screenshots</strong></label><input id="ocrFiles" type="file" accept="image/*" multiple><button type="button" class="primary" id="runOcr">Read screenshots</button><div id="ocrStatus" class="ocrprogress" role="status"></div><div class="formrow"><label for="importText">Or paste / edit recipe text</label><textarea id="importText" class="field" placeholder="Paste an Instagram caption, or review text from screenshots here..."></textarea></div><button type="button" class="secondary" id="parseImport">Fill recipe fields from text</button><p class="hint">Free OCR needs internet on first use. Images are processed in your browser; no screenshots are saved or uploaded by Crumb. Review all extracted amounts and instructions. For handwritten or unclear text, iPhone Live Text may work better.</p></section><form id="recipeForm"><div class="formrow"><label for="url">Instagram or original recipe link</label><input class="field" type="url" id="url" placeholder="https://www.instagram.com/reel/..." value="${esc(r.url||'')}"><div class="hint">Links are saved; Instagram videos are not automatically analyzed yet.</div></div><div class="formrow"><label for="title">Recipe name *</label><input class="field" id="title" required maxlength="160" value="${esc(r.title||'')}" placeholder="e.g. Creamy tomato pasta"></div><div class="formrow"><label for="category">Category</label><select class="field" id="category">${CATS.map(c=>`<option ${r.catego function details(){let r=recipes.find(x=>x.id===detail);if(!r)return home();return `<button class="topback" data-action="back">← Back to recipes</button><div class="panel"><div class="eyebrow">${esc(r.category)}</div><h1 class="hero">${esc(r.title)}</h1><p class="muted">◷ ${esc(r.time||'Time not set')} · ${esc(r.servings||'Servings not set')}</p><span class="status">${r.status==='made'?'✓ Made it':'Want to try'}</span>${r.image?`<p><img src="${esc(r.image)}" alt="${esc(r.title)}" style="width:100%;max-height:320px;object-fit:cover;border-radius:14px"></p>`:''}<hr class="divider"><h2>Ingredients</h2>${r.ingredients.length?`<ul class="ingredients">${r.ingredients.map(s=>`<li><label><input type="checkbox">${esc(s)}</label></li>`).join('')}</ul>`:'<p class="muted">No ingredients added.</p>'}<hr class="divider"><h2>Instructions</h2>${r.steps.length?`<ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'<p class="muted">No instructions added.</p>'}${r.tags?`<p class="tiny">Tags: ${esc(r.tags)}</p>`:''}${r.url?`<p><a class="secondary" style="display:inline-block;text-decoration:none" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open original recipe ↗</a></p>`:''}<hr class="divider"><div class="actions"><button class="primary" data-action="edit" data-id="${esc(r.id)}">Edit</button><button class="secondary" data-action="status" data-id="${esc(r.id)}">${r.status==='made'?'Mark Want to try':'Mark Made it'}</button><button class="secondary" data-action="favorite" data-id="${esc(r.id)}">${r.favorite?'♥ Favorite':'♡ Favorite'}</button><button class="danger" data-action="delete" data-id="${esc(r.id)}">Delete</button></div></div>`}
function settings(){return `<h1 class="hero">Your recipe book</h1><p class="muted">Your recipes live in this browser on this device. Export backups regularly, especially before clearing Safari data or changing phones.</p><div class="panel"><h2>Backup & restore</h2><p class="muted">Export all recipes to a JSON file. You can import it later on this or another device.</p><button class="primary" id="export">Export recipes</button><div class="formrow"><label for="import">Import a backup</label><input class="field file" type="file" accept="application/json,.json" id="import"></div><p class="hint">Import adds recipes from the file and updates recipes with matching IDs. Keep your backup file private.</p></div><div class="panel"><h2>Install Crumb</h2><p class="muted">On iPhone, open the deployed website in Safari, tap Share, then Add to Home Screen.</p><p class="hint">For offline loading, the site must be served over HTTPS and the service worker must have been installed successfully.</p></div><div class="panel"><h2>About</h2><p class="muted">Crumb 1.2 · Free, local-first recipe organizer. No account and no AI API required.</p></div>`}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view||view==='detail'&&b.dataset.nav==='home'));$('main').innerHTML=view==='home'?home():view==='favorites'?favorites():view==='add'?form():view==='detail'?details():settings();if(view==='home'){let input=$('search');input.addEventListener('input',e=>{query=e.target.value;const pos=input.selectionStart;const focused=document.activeElement===input;const arr=recipes.filter(r=>(filter==='All'||filter==='Want to try'&&r.status!=='made'||filter==='Made it'&&r.status==='made'||r.category===filter)&&(r.title+' '+r.ingredients.join(' ')+' '+r.tags).toLowerCase().includes(query.toLowerCase()));const grid=document.querySelector('.grid');if(grid)grid.outerHTML=arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:'<div class="empty">No recipes found.</div>';else render();if(focused){input.focus();input.setSelectionRange(pos,pos)}})}if(view==='add'){selectedCover=recipes.find(r=>r.id===editing)?.image||'';$('coverFile').addEventListener('change',onCoverChosen);$('removeCover').addEventListener('click',()=>setCover(''));$('recipeForm').addEventListener('submit',save);$('runOcr').addEventListener('click',runScreenshotOCR);$('parseImport').addEventListener('click',parseImportText)}if(view==='settings'){$('export').onclick=exportData;$('import').onchange=importData}}
function favorites(){let arr=recipes.filter(r=>r.favorite);return `<h1 class="hero">Your favorites ♡</h1><p class="muted">The recipes you love most.</p>${arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:'<div class="empty">No favorites yet.</div>'}`}
function save(e){e.preventDefault();const val=id=>$(id).value.trim();const url=val('url');if(url){try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{return toast('Please enter a valid http(s) link.')}}let old=recipes.find(r=>r.id===editing);let item={id:old?.id||uid(),title:val('title'),url,category:val('category'),time:val('time'),servings:val('servings'),ingredients:val('ingredients').split('\n').map(s=>s.trim()).filter(Boolean),steps:val('instructions').split('\n').map(s=>s.trim()).filter(Boolean),tags:val('tags'),image:selectedCover||'',status:val('status'),favorite:old?.favorite||false,createdAt:old?.createdAt||new Date().toISOString()};if(!item.title)return toast('Please enter a recipe name.');const before=recipes;recipes=old?recipes.map(r=>r.id===old.id?item:r):[item,...recipes];if(persist()){detail=item.id;view='detail';editing=null;selectedCover=null;render();toast('Recipe saved!')}else recipes=before}
function exportData(){let data=JSON.stringify({app:'crumb',version:1,exportedAt:new Date().toISOString(),recipes},null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='crumb-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validRecipe(r){return r&&typeof r==='object'&&typeof r.title==='string'&&r.title.trim()&&Array.isArray(r.ingredients)&&Array.isArray(r.steps)&&r.ingredients.every(x=>typeof x==='string')&&r.steps.every(x=>typeof x==='string')}async function importData(e){let file=e.target.files?.[0];if(!file)return;if(file.size>40e6)return toast('Backup is too large (40 MB max).');try{let parsed=JSON.parse(await file.text());if(parsed.app!=='crumb'||!Array.isArray(parsed.recipes)||parsed.recipes.length>5000||!parsed.recipes.every(validRecipe))throw Error();let map=new Map(recipes.map(r=>[r.id,r]));for(let r of parsed.recipes){let clean={id:typeof r.id==='string'?r.id:uid(),title:r.title.slice(0,160),url:typeof r.url==='string'&&/^https?:\/\//i.test(r.url)?r.url:'',category:CATS.includes(r.category)?r.category:'Other',time:String(r.time||'').slice(0,50),servings:String(r.servings||'').slice(0,40),ingredients:r.ingredients.map(x=>x.slice(0,500)),steps:r.steps.map(x=>x.slice(0,2000)),tags:String(r.tags||'').slice(0,500),image:typeof r.image==='string'&&(/^(https?:\/\/|data:image\/(jpeg|png|webp);base64,)/i.test(r.image))&&r.image.length<1200000?r.image:'',status:r.status==='made'?'made':'try',favorite:!!r.favorite,createdAt:String(r.createdAt||'')};map.set(clean.id,clean)}const before=recipes;recipes=[...map.values()];if(persist()){render();toast('Backup imported!')}else recipes=before}catch{toast('Invalid Crumb backup file.')}}

function setCover(value){selectedCover=value;const preview=$('coverPreview'),remove=$('removeCover');if(value){preview.src=value;preview.classList.remove('hidden');remove.classList.remove('hidden')}else{preview.removeAttribute('src');preview.classList.add('hidden');remove.classList.add('hidden')}if($('coverFile'))$('coverFile').value='';$('coverStatus').textContent=value?'Cover ready to save.':'No cover selected.'}
async function onCoverChosen(e){const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('Please choose an image.');if(file.size>15*1024*1024)return toast('Choose an image under 15 MB.');$('coverStatus').textContent='Preparing photo…';try{const data=await compressCover(file);setCover(data)}catch(err){$('coverStatus').textContent='Could not read photo.';toast('Try a JPG or PNG screenshot instead.')}}
function compressCover(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const max=800,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.68);URL.revokeObjectURL(url);if(data.length>750000)throw Error('Image too large');resolve(data)}catch(err){URL.revokeObjectURL(url);reject(err)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Image load failed'))};img.src=url})}
let ocrLoader=null;
function getOCRLibrary(){
 if(window.Tesseract)return Promise.resolve(window.Tesseract);
 if(ocrLoader)return ocrLoader;
 ocrLoader=new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  script.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(Error('OCR library unavailable'));
  script.onerror=()=>reject(Error('OCR library could not be loaded'));
  document.head.appendChild(script);
 }).catch(e=>{ocrLoader=null;throw e});
 return ocrLoader;
}
async function runScreenshotOCR(){
 const files=Array.from($('ocrFiles')?.files||[]);
 if(!files.length)return toast('Choose one or more screenshots first.');
 if(files.length>12)return toast('Please select up to 12 screenshots.');
 if(files.some(f=>!f.type.startsWith('image/')||f.size>12*1024*1024))return toast('Each screenshot must be an image under 12 MB.');
 const button=$('runOcr'),status=$('ocrStatus');
 button.disabled=true;
 let worker;
 try{
  status.textContent='Loading free text recognition… (internet required)';
  const T=await getOCRLibrary();
  worker=await T.createWorker('eng',1,{logger:m=>{
   if(m.status==='recognizing text'&&status)status.textContent='Reading text… '+Math.round((m.progress||0)*100)+'%';
  }});
  const texts=[];
  for(let i=0;i<files.length;i++){
   status.textContent=`Reading screenshot ${i+1} of ${files.length}…`;
   const result=await worker.recognize(files[i]);
   texts.push(result.data.text.trim());
  }
  const field=$('importText');
  if(field){field.value=[field.value.trim(),...texts.filter(Boolean)].filter(Boolean).join('\n\n');}
  status.textContent=`Done! Read ${files.length} screenshot${files.length===1?'':'s'}. Check the text, then tap “Fill recipe fields from text”.`;
 }catch(e){
  status.textContent='Could not read screenshots. Check your connection, or use iPhone Photos → Live Text to copy the caption and paste it here.';
 }finally{
  if(worker)await worker.terminate().catch(()=>{});
  if(button)button.disabled=false;
 }
}
function parseImportText(){

 const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const ingredientHeader=/^(ingredients?|what you(?:'|’)ll need|you(?:'|’)ll need|for the (?:dough|filling|sauce|topping|glaze|frosting))\s*:?\s*$/i;
 const stepsHeader=/^(instructions?|directions?|method|preparation|steps?|how to make(?: it)?|recipe|let(?:'|’)s (?:make|cook|bake)(?: it)?)\s*:?\s*$/i;
 const quantity=/^(?:[-•*]\s*)?(?:(?:\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?|\d+\s*\/\s*\d+|[¼½¾⅓⅔⅛])\s*(?:g|kg|mg|ml|l|cups?|tbsp|tsp|tablespoons?|teaspoons?|oz|lb|lbs|cloves?|pinch(?:es)?|handfuls?|pieces?|pcs?|cans?|packets?|sticks?|slices?|large|medium|small|eggs?)?\b|(?:salt|pepper|olive oil|water|butter|flour|sugar)\s+to taste\b)/i;
 const stepLike=/^(?:step\s*\d+[:.)-]?\s*|\d+[.)]\s+|[-•*]\s*)?(?:preheat|mix|stir|combine|add|bake|cook|heat|chop|slice|whisk|pour|serve|fold|knead|let |leave |place|transfer|blend|bring |simmer|boil|fry|roast|spread|roll|drain|season|remove|set |beat |melt|cover|refrigerate|peel|wash|cut )/i;
 let mode='',ings=[],steps=[],other=[];
 for(const original of lines){
  const line=original.replace(/^[-•*]\s*/,'').trim();
  if(ingredientHeader.test(line)){mode='ingredients';continue}
  if(stepsHeader.test(line)){mode='steps';continue}
  if(/^#|^https?:\/\//i.test(line))continue;
  if(mode==='ingredients'&&stepLike.test(line))mode='steps';
  if(mode==='steps')steps.push(line.replace(/^(?:step\s*)?\d+[.)-]\s*/i,''));
  else if(mode==='ingredients')ings.push(line);
  else if(quantity.test(line)&&!stepLike.test(line))ings.push(line);
  else if(stepLike.test(line)||/^\d+[.)]\s+/.test(original))steps.push(line.replace(/^\d+[.)]\s*/,'')); 
  else other.push(line);
 }
 if(!ings.length&&!steps.length)return toast('No clear ingredients or steps found. You can edit the text manually.');
 if(ings.length){$('ingredients').value=[...new Set(ings)].join('\n')}
 if(steps.length){$('instructions').value=steps.join('\n')}
 if(!$('title').value.trim()){
  const possible=other.find(x=>x.length>=4&&x.length<=85&&!/^(save|follow|comment|like|share|recipe in bio|serves|prep time|cook time)/i.test(x));
  if(possible)$('title').value=possible.replace(/^#+\s*/,'');
 }
 $('ocrStatus').textContent=`Suggested ${ings.length} ingredient line(s) and ${steps.length} step(s). Review and correct the fields below before saving.`;
 toast('Recipe fields filled — please review!');
 $('title').scrollIntoView({behavior:'smooth',block:'center'});
}

document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}let a=e.target.closest('[data-action]');if(!a)return;let id=a.dataset.id,r=recipes.find(x=>x.id===id);switch(a.dataset.action){case'open':detail=id;view='detail';render();break;case'back':navigate('home');break;case'edit':editing=id;view='add';render();break;case'favorite':if(r){r.favorite=!r.favorite;persist();render()}break;case'status':if(r){r.status=r.status==='made'?'try':'made';persist();render()}break;case'delete':if(r&&confirm('Delete this recipe permanently?')){recipes=recipes.filter(x=>x.id!==id);persist();navigate('home');toast('Recipe deleted')}break}});load();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
