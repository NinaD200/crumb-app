<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f4ec"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Crumb"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Crumb — your little recipe book</title><style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#354333;background:#f8f4ec}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #b16f53;outline-offset:2px}.app{max-width:760px;margin:auto;padding:24px 18px 105px}header{display:flex;align-items:center;gap:12px;margin-bottom:38px}.logo{background:#e4e9dc;padding:12px;border-radius:14px;font-size:24px}.brand{font-family:Georgia,serif;font-size:31px;font-weight:bold;line-height:1}.tag{font-size:11px;color:#8b8a7c;letter-spacing:1px;margin-top:4px}.eyebrow{font-size:11px;color:#a46f56;letter-spacing:2px;text-transform:uppercase}.hero{font:normal 34px/1.15 Georgia,serif;margin:10px 0}.muted{color:#7e8174}.search,.field{width:100%;border:1px solid #e3dfd5;background:#fff;border-radius:13px;padding:14px;color:#354333}.search{margin:24px 0}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 22px}.chip{border:1px solid #d7dacd;background:transparent;color:#55634e;padding:9px 13px;border-radius:22px;white-space:nowrap}.chip.active,.primary{background:#586b53;color:white;border:1px solid #586b53}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.recipe{border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 2px 12px #4c493d0a}.photo{height:140px;background:#e6e9dc;display:flex;align-items:center;justify-content:center;font-size:56px}.photo img{width:100%;height:100%;object-fit:cover}.recipe-content{padding:14px}.category{font-size:10px;letter-spacing:1.3px;color:#ad775f;text-transform:uppercase}.recipe h3{font:normal 19px/1.2 Georgia,serif;margin:7px 0;min-height:46px}.tiny{font-size:12px;color:#85887d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.secondary,.primary,.danger{border-radius:12px;padding:11px 15px}.secondary{background:#fff;border:1px solid #d5d9ce;color:#53634f}.danger{background:#fff;border:1px solid #d7a9a1;color:#a24e44}.primary{font-weight:600}.small{padding:7px 10px;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e2d9;display:flex;justify-content:center;padding:12px 12px max(14px,env(safe-area-inset-bottom));gap:12px;z-index:3}.nav button{flex:1;max-width:190px;background:none;border:none;color:#7c8275;padding:8px 0}.nav button.active{color:#536d4d;font-weight:bold}.panel{background:#fff;border-radius:18px;padding:20px;margin:18px 0}.formrow{margin:17px 0}.formrow label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}textarea{min-height:120px;resize:vertical}.hint{font-size:12px;color:#85887d;margin-top:6px}.steps{padding-left:22px;line-height:1.7}.ingredients{list-style:none;padding:0}.ingredients li{margin:12px 0}.ingredients input{margin-right:10px;accent-color:#586b53}.topback{border:none;background:none;color:#586b53;padding:8px 0}.status{display:inline-block;padding:6px 10px;background:#e6eadf;color:#4c6047;border-radius:20px;font-size:12px}.empty{text-align:center;padding:55px 15px;color:#85887d}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#354333;color:white;border-radius:12px;padding:12px 18px;z-index:5;max-width:90%;text-align:center}.hidden{display:none}.divider{border:0;border-top:1px solid #e6e2d9;margin:22px 0}.file{max-width:100%}@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:175px}}@media(max-width:360px){.grid{gap:9px}.recipe-content{padding:10px}.recipe h3{font-size:17px}}
</style></head><body><div class="app"><header><div class="logo">♧</div><div><div class="brand">crumb.</div><div class="tag">YOUR LITTLE RECIPE BOOK</div></div></header><main id="main"></main></div><nav class="nav"><button data-nav="home">⌂<br>Home</button><button data-nav="add">⊕<br>Add recipe</button><button data-nav="favorites">♡<br>Favorites</button><button data-nav="settings">⚙<br>Settings</button></nav><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';const KEY='crumb.recipes.v1';const CATS=['Dinner','Baking','Breakfast','Desserts','Snacks','Lunch','Drinks','Other'];let recipes=[],view='home',filter='All',query='',editing=null,detail=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');recipes=Array.isArray(x)?x:[]}catch{recipes=[];toast('Could not load saved recipes.')}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(recipes));return true}catch{toast('Storage is full or unavailable. Export a backup.');return false}}function navigate(v){view=v;editing=null;detail=null;render();window.scrollTo(0,0)}function categories(){return ['All',...CATS,'Want to try','Made it']}function card(r){return `<article class="recipe"><div class="photo">${r.image?`<img src="${esc(r.image)}" alt="${esc(r.title)}" loading="lazy">`:'🍽️'}</div><div class="recipe-content"><div class="category">${esc(r.category)}</div><h3>${esc(r.title)}</h3><div class="tiny">◷ ${esc(r.time||'Time not set')} · ${r.status==='made'?'✓ Made it':'Want to try'}</div><div class="actions"><button class="secondary small" data-action="open" data-id="${esc(r.id)}">View</button><button class="secondary small" data-action="favorite" data-id="${esc(r.id)}" aria-label="Toggle favorite">${r.favorite?'♥':'♡'}</button></div></div></article>`}function home(){let arr=recipes.filter(r=>(filter==='All'||filter==='Want to try'&&r.status!=='made'||filter==='Made it'&&r.status==='made'||r.category===filter)&&(r.title+' '+r.ingredients.join(' ')+' '+r.tags).toLowerCase().includes(query.toLowerCase()));return `<div class="eyebrow">My kitchen · Recipe collection</div><h1 class="hero">What are we cooking today?</h1><div class="muted">A little inspiration for your next meal.</div><input id="search" class="search" placeholder="Search recipes or ingredients..." value="${esc(query)}" aria-label="Search recipes"><div class="between"><strong>My collection</strong><span class="tiny">${recipes.length} recipes</span></div><div class="chips">${categories().map(c=>`<button class="chip ${filter===c?'active':''}" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div>${arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:`<div class="empty">No recipes here yet.<p>Tap Add recipe to save your first one.</p></div>`}`}
function form(){let r=recipes.find(x=>x.id===editing)||{};return `<button class="topback" data-action="back">← Back</button><h1 class="hero">${editing?'Edit recipe':'Add a recipe'}</h1><p class="muted">Keep your favorite recipes in one cozy place.</p><form id="recipeForm"><div class="formrow"><label for="url">Instagram or original recipe link</label><input class="field" type="url" id="url" placeholder="https://www.instagram.com/reel/..." value="${esc(r.url||'')}"><div class="hint">Links are saved; Instagram videos are not automatically analyzed yet.</div></div><div class="formrow"><label for="title">Recipe name *</label><input class="field" id="title" required maxlength="160" value="${esc(r.title||'')}" placeholder="e.g. Creamy tomato pasta"></div><div class="formrow"><label for="category">Category</label><select class="field" id="category">${CATS.map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="formrow"><label for="time">Time</label><input class="field" id="time" maxlength="50" value="${esc(r.time||'')}" placeholder="e.g. 30 min"></div><div class="formrow"><label for="servings">Servings</label><input class="field" id="servings" maxlength="40" value="${esc(r.servings||'')}" placeholder="e.g. 4"></div><div class="formrow"><label for="ingredients">Ingredients (one per line)</label><textarea class="field" id="ingredients" placeholder="200 g flour&#10;2 eggs&#10;100 ml milk">${esc((r.ingredients||[]).join('\n'))}</textarea></div><div class="formrow"><label for="instructions">Instructions (one step per line)</label><textarea class="field" id="instructions" placeholder="Mix the ingredients&#10;Bake for 20 minutes">${esc((r.steps||[]).join('\n'))}</textarea></div><div class="formrow"><label for="tags">Tags (comma-separated)</label><input class="field" id="tags" value="${esc(r.tags||'')}" placeholder="quick, vegetarian, comfort food"></div><div class="formrow"><label for="image">Image URL (optional)</label><input class="field" type="url" id="image" value="${esc(r.image||'')}" placeholder="https://..."><div class="hint">Only use images you have permission to display. An external image may stop working.</div></div><div class="formrow"><label for="status">Cooking status</label><select class="field" id="status"><option value="try" ${r.status!=='made'?'selected':''}>Want to try</option><option value="made" ${r.status==='made'?'selected':''}>Made it</option></select></div><button class="primary" type="submit">${editing?'Save changes':'Save recipe'}</button></form>`}
function details(){let r=recipes.find(x=>x.id===detail);if(!r)return home();return `<button class="topback" data-action="back">← Back to recipes</button><div class="panel"><div class="eyebrow">${esc(r.category)}</div><h1 class="hero">${esc(r.title)}</h1><p class="muted">◷ ${esc(r.time||'Time not set')} · ${esc(r.servings||'Servings not set')}</p><span class="status">${r.status==='made'?'✓ Made it':'Want to try'}</span>${r.image?`<p><img src="${esc(r.image)}" alt="${esc(r.title)}" style="width:100%;max-height:320px;object-fit:cover;border-radius:14px"></p>`:''}<hr class="divider"><h2>Ingredients</h2>${r.ingredients.length?`<ul class="ingredients">${r.ingredients.map(s=>`<li><label><input type="checkbox">${esc(s)}</label></li>`).join('')}</ul>`:'<p class="muted">No ingredients added.</p>'}<hr class="divider"><h2>Instructions</h2>${r.steps.length?`<ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'<p class="muted">No instructions added.</p>'}${r.tags?`<p class="tiny">Tags: ${esc(r.tags)}</p>`:''}${r.url?`<p><a class="secondary" style="display:inline-block;text-decoration:none" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open original recipe ↗</a></p>`:''}<hr class="divider"><div class="actions"><button class="primary" data-action="edit" data-id="${esc(r.id)}">Edit</button><button class="secondary" data-action="status" data-id="${esc(r.id)}">${r.status==='made'?'Mark Want to try':'Mark Made it'}</button><button class="secondary" data-action="favorite" data-id="${esc(r.id)}">${r.favorite?'♥ Favorite':'♡ Favorite'}</button><button class="danger" data-action="delete" data-id="${esc(r.id)}">Delete</button></div></div>`}
function settings(){return `<h1 class="hero">Your recipe book</h1><p class="muted">Your recipes live in this browser on this device. Export backups regularly, especially before clearing Safari data or changing phones.</p><div class="panel"><h2>Backup & restore</h2><p class="muted">Export all recipes to a JSON file. You can import it later on this or another device.</p><button class="primary" id="export">Export recipes</button><div class="formrow"><label for="import">Import a backup</label><input class="field file" type="file" accept="application/json,.json" id="import"></div><p class="hint">Import adds recipes from the file and updates recipes with matching IDs. Keep your backup file private.</p></div><div class="panel"><h2>Install Crumb</h2><p class="muted">On iPhone, open the deployed website in Safari, tap Share, then Add to Home Screen.</p><p class="hint">For offline loading, the site must be served over HTTPS and the service worker must have been installed successfully.</p></div><div class="panel"><h2>About</h2><p class="muted">Crumb 1.0 · Free, local-first recipe organizer. No account and no AI API required.</p></div>`}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view||view==='detail'&&b.dataset.nav==='home'));$('main').innerHTML=view==='home'?home():view==='favorites'?favorites():view==='add'?form():view==='detail'?details():settings();if(view==='home'){let input=$('search');input.addEventListener('input',e=>{query=e.target.value;const pos=input.selectionStart;const focused=document.activeElement===input;const arr=recipes.filter(r=>(filter==='All'||filter==='Want to try'&&r.status!=='made'||filter==='Made it'&&r.status==='made'||r.category===filter)&&(r.title+' '+r.ingredients.join(' ')+' '+r.tags).toLowerCase().includes(query.toLowerCase()));const grid=document.querySelector('.grid');if(grid)grid.outerHTML=arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:'<div class="empty">No recipes found.</div>';else render();if(focused){input.focus();input.setSelectionRange(pos,pos)}})}if(view==='add')$('recipeForm').addEventListener('submit',save);if(view==='settings'){$('export').onclick=exportData;$('import').onchange=importData}}
function favorites(){let arr=recipes.filter(r=>r.favorite);return `<h1 class="hero">Your favorites ♡</h1><p class="muted">The recipes you love most.</p>${arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:'<div class="empty">No favorites yet.</div>`}`}
function save(e){e.preventDefault();const val=id=>$(id).value.trim();const url=val('url');if(url){try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{return toast('Please enter a valid http(s) link.')}}let old=recipes.find(r=>r.id===editing);let item={id:old?.id||uid(),title:val('title'),url,category:val('category'),time:val('time'),servings:val('servings'),ingredients:val('ingredients').split('\n').map(s=>s.trim()).filter(Boolean),steps:val('instructions').split('\n').map(s=>s.trim()).filter(Boolean),tags:val('tags'),image:val('image'),status:val('status'),favorite:old?.favorite||false,createdAt:old?.createdAt||new Date().toISOString()};if(!item.title)return toast('Please enter a recipe name.');recipes=old?recipes.map(r=>r.id===old.id?item:r):[item,...recipes];if(persist()){detail=item.id;view='detail';editing=null;render();toast('Recipe saved!')}}
function exportData(){let data=JSON.stringify({app:'crumb',version:1,exportedAt:new Date().toISOString(),recipes},null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='crumb-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function validRecipe(r){return r&&typeof r==='object'&&typeof r.title==='string'&&r.title.trim()&&Array.isArray(r.ingredients)&&Array.isArray(r.steps)&&r.ingredients.every(x=>typeof x==='string')&&r.steps.every(x=>typeof x==='string')}async function importData(e){let file=e.target.files?.[0];if(!file)return;if(file.size>5e6)return toast('Backup is too large.');try{let parsed=JSON.parse(await file.text());if(parsed.app!=='crumb'||!Array.isArray(parsed.recipes)||parsed.recipes.length>5000||!parsed.recipes.every(validRecipe))throw Error();let map=new Map(recipes.map(r=>[r.id,r]));for(let r of parsed.recipes){let clean={id:typeof r.id==='string'?r.id:uid(),title:r.title.slice(0,160),url:typeof r.url==='string'&&/^https?:\/\//i.test(r.url)?r.url:'',category:CATS.includes(r.category)?r.category:'Other',time:String(r.time||'').slice(0,50),servings:String(r.servings||'').slice(0,40),ingredients:r.ingredients.map(x=>x.slice(0,500)),steps:r.steps.map(x=>x.slice(0,2000)),tags:String(r.tags||'').slice(0,500),image:typeof r.image==='string'&&/^https?:\/\//i.test(r.image)?r.image:'',status:r.status==='made'?'made':'try',favorite:!!r.favorite,createdAt:String(r.createdAt||'')};map.set(clean.id,clean)}recipes=[...map.values()];persist();render();toast('Backup imported!')}catch{toast('Invalid Crumb backup file.')}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}let a=e.target.closest('[data-action]');if(!a)return;let id=a.dataset.id,r=recipes.find(x=>x.id===id);switch(a.dataset.action){case'open':detail=id;view='detail';render();break;case'back':navigate('home');break;case'edit':editing=id;view='add';render();break;case'favorite':if(r){r.favorite=!r.favorite;persist();render()}break;case'status':if(r){r.status=r.status==='made'?'try':'made';persist();render()}break;case'delete':if(r&&confirm('Delete this recipe permanently?')){recipes=recipes.filter(x=>x.id!==id);persist();navigate('home');toast('Recipe deleted')}break}});load();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
