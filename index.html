:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#354333;background:#f8f4ec}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #b16f53;outline-offset:2px}.app{max-width:760px;margin:auto;padding:24px 18px calc(210px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:12px;margin-bottom:38px}.logo{background:#e4e9dc;padding:12px;border-radius:14px;font-size:24px}.brand{font-family:Georgia,serif;font-size:31px;font-weight:bold;line-height:1}.tag{font-size:11px;color:#8b8a7c;letter-spacing:1px;margin-top:4px}.eyebrow{font-size:11px;color:#a46f56;letter-spacing:2px;text-transform:uppercase}.hero{font:normal 34px/1.15 Georgia,serif;margin:10px 0}.muted{color:#7e8174}.search,.field{width:100%;border:1px solid #e3dfd5;background:#fff;border-radius:13px;padding:14px;color:#354333}.search{margin:24px 0}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 22px}.chip{border:1px solid #d7dacd;background:transparent;color:#55634e;padding:9px 13px;border-radius:22px;white-space:nowrap}.chip.active,.primary{background:#586b53;color:white;border:1px solid #586b53}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.recipe{border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 2px 12px #4c493d0a}.photo{height:140px;background:#e6e9dc;display:flex;align-items:center;justify-content:center;font-size:56px}.photo img{width:100%;height:100%;object-fit:cover}.recipe-content{padding:14px}.category{font-size:10px;letter-spacing:1.3px;color:#ad775f;text-transform:uppercase}.recipe h3{font:normal 19px/1.2 Georgia,serif;margin:7px 0;min-height:46px}.tiny{font-size:12px;color:#85887d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.secondary,.primary,.danger{border-radius:12px;padding:11px 15px}.secondary{background:#fff;border:1px solid #d5d9ce;color:#53634f}.danger{background:#fff;border:1px solid #d7a9a1;color:#a24e44}.primary{font-weight:600}.small{padding:7px 10px;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e2d9;display:flex;justify-content:center;padding:12px 12px max(14px,env(safe-area-inset-bottom));gap:12px;z-index:3}.nav button{flex:1;max-width:190px;background:none;border:none;color:#7c8275;padding:8px 0}.nav button.active{color:#536d4d;font-weight:bold}.panel{background:#fff;border-radius:18px;padding:20px;margin:18px 0}.formrow{margin:17px 0}.formrow label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}textarea{min-height:120px;resize:vertical}.hint{font-size:12px;color:#85887d;margin-top:6px}.steps{padding-left:22px;line-height:1.7}.ingredients{list-style:none;padding:0}.ingredients li{margin:12px 0}.ingredients input{margin-right:10px;accent-color:#586b53}.topback{border:none;background:none;color:#586b53;padding:8px 0}.status{display:inline-block;padding:6px 10px;background:#e6eadf;color:#4c6047;border-radius:20px;font-size:12px}.empty{text-align:center;padding:55px 15px;color:#85887d}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#354333;color:white;border-radius:12px;padding:12px 18px;z-index:5;max-width:90%;text-align:center}.hidden{display:none}.divider{border:0;border-top:1px solid #e6e2d9;margin:22px 0}.file{max-width:100%}.cover-preview{width:100%;max-height:250px;object-fit:cover;border-radius:14px;margin-top:10px}.cover-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}.save-row{padding:18px 0 32px}.formrow input[type=file]{padding:12px}@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:175px}}@media(max-width:360px){.grid{gap:9px}.recipe-content{padding:10px}.recipe h3{font-size:17px}}

.nav{gap:7px;padding:10px 10px max(12px,env(safe-area-inset-bottom));box-shadow:0 -5px 20px #263c2b0b}.nav button{border:1px solid #e7e9e1;background:#f8f8f4;border-radius:15px;padding:10px 3px;min-height:64px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:12px;line-height:1.1;transition:background .15s,transform .15s}.nav button .navicon{font-size:23px;line-height:1.1}.nav button.active{background:#586b53;color:white;border-color:#586b53;box-shadow:0 3px 9px #586b5333}.nav button:active{transform:scale(.96);background:#e1e9dd}.nav button.active:active{background:#455b42}.recipe{position:relative}.recipe-open{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}.recipe-open:active{background:#f2f4ed}.recipe-open:focus-visible{outline:3px solid #a46f56;outline-offset:-3px}.recipe .actions{justify-content:flex-end;margin-top:0}.recipe .actions button{min-height:40px;min-width:44px;font-size:20px}.recipe .photo{pointer-events:none}.recipe-content{pointer-events:none}.recipe .actions{pointer-events:auto}.pantry-entry{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#eef1e8;border:1px solid #dbe2d5;border-radius:16px;padding:14px;margin:0 0 18px;color:#445b40;text-align:left}.pantry-entry strong{display:block}.pantry-entry small{display:block;color:#667762;margin-top:4px}.chosen{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}.chosen span{background:#e8eee2;color:#4b6047;border-radius:25px;padding:7px 10px;font-size:12px}.match-badge{display:inline-block;margin:8px 0 0;padding:5px 8px;background:#e8eee2;color:#41633c;border-radius:20px;font-size:11px}.match-badge.missing{background:#f7ecdf;color:#8b6037}.ingredient-tabs,.food-groups{display:flex;gap:7px;overflow-x:auto;margin:12px 0;padding:4px 0}.food-tab{white-space:nowrap;border:1px solid #d8ddcf;border-radius:22px;background:white;padding:9px 13px;color:#53634f}.food-tab.active{background:#586b53;color:white}.food-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}.food-tile{min-height:75px;border:1px solid #e1dfd6;border-radius:14px;background:#fff;color:#455444;padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px}.food-tile span{font-size:24px}.food-tile.selected{background:#e6eddf;border:2px solid #5d7854}.ingredient-panel{background:#fff;border-radius:18px;padding:16px;margin:16px 0}.pantry-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.switchrow{display:flex;align-items:center;gap:10px;background:#eef1e8;padding:13px;border-radius:14px;margin:18px 0}.switchrow input{width:20px;height:20px;accent-color:#586b53}.ingredient-footer{position:sticky;bottom:calc(95px + env(safe-area-inset-bottom));background:#f8f4ec;padding:12px 0 6px;z-index:2}.ingredient-footer button{width:100%}.match-note{font-size:12px;color:#697766;margin:8px 0}.app{padding-bottom:calc(220px + env(safe-area-inset-bottom))}

</style></head><body><div class="app"><header><div class="logo">♧</div><div><div class="brand">crumb.</div><div class="tag">YOUR LITTLE RECIPE BOOK</div></div></header><main id="main"></main></div><nav class="nav"><button data-nav="home"><span class="navicon">⌂</span>Home</button><button data-nav="add"><span class="navicon">⊕</span>Add recipe</button><button data-nav="favorites"><span class="navicon">♡</span>Favorites</button><button data-nav="settings"><span class="navicon">⚙</span>Settings</button></nav><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';const KEY='crumb.recipes.v1';const CATS=['Dinner','Baking','Breakfast','Desserts','Snacks','Lunch','Drinks','Other'];let recipes=[],view='home',filter='All',query='',editing=null,detail=null,selectedCover=null,ingredientTab='ingredients',foodGroup='All';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');recipes=Array.isArray(x)?x:[]}catch{recipes=[];toast('Could not load saved recipes.')}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(recipes));return true}catch{toast('Storage is full or unavailable. Export a backup.');return false}}function navigate(v){view=v;editing=null;detail=null;selectedCover=null;render();window.scrollTo(0,0)}function categories(){return ['All',...CATS,'Want to try','Made it']}function card(r){const match=selectedFoods.size?recipeMatch(r):null;const badge=match?`<div class="match-badge ${match.missing.length?'missing':''}">${match.missing.length?`Missing ${match.missing.length}: ${esc(match.missing.slice(0,2).join(', '))}`:'✓ All ingredients available'}</div>`:'';return `<article class="recipe"><button type="button" class="recipe-open" data-action="open" data-id="${esc(r.id)}" aria-label="Open ${esc(r.title)}"><div class="photo">${r.image?`<img src="${esc(r.image)}" alt="" loading="lazy">`:'🍽️'}</div><div class="recipe-content"><div class="category">${esc(r.category)}</div><h3>${esc(r.title)}</h3><div class="tiny">◷ ${esc(r.time||'Time not set')} · ${r.status==='made'?'✓ Made it':'Want to try'}</div>${badge}</div></button><div class="actions" style="padding:0 12px 12px"><button class="secondary small" data-action="favorite" data-id="${esc(r.id)}" aria-label="Toggle favorite for ${esc(r.title)}">${r.favorite?'♥':'♡'}</button></div></article>`}
function filteredRecipes(){let arr=recipes.filter(r=>(filter==='All'||filter==='Want to try'&&r.status!=='made'||filter==='Made it'&&r.status==='made'||r.category===filter)&&(r.title+' '+r.ingredients.join(' ')+' '+r.tags).toLowerCase().includes(query.toLowerCase()));if(selectedFoods.size){arr=arr.map(r=>({r,m:recipeMatch(r)})).filter(x=>(x.m.covered+x.m.missing.length)>0&&x.m.missing.length<=(flexibleMatch?2:0)).sort((a,b)=>a.m.missing.length-b.m.missing.length||b.m.covered-a.m.covered).map(x=>x.r)}return arr}
function resultsMarkup(){const arr=filteredRecipes();return arr.length?`<div id="recipeResults" class="grid">${arr.map(card).join('')}</div>`:`<div id="recipeResults" class="empty">No matching recipes.<p>Try adding ingredients or turning on Flexible match.</p></div>`}
function home(){return `<div class="eyebrow">My kitchen · Recipe collection</div><h1 class="hero">What are we cooking today?</h1><div class="muted">A little inspiration for your next meal.</div><input id="search" class="search" placeholder="Search recipes or ingredients..." value="${esc(query)}" aria-label="Search recipes"><button type="button" class="pantry-entry" data-action="ingredients"><span><strong>🥕 Cook with what you have</strong><small>${selectedFoods.size?`${selectedFoods.size} selected · ${flexibleMatch?'Flexible match':'Strict match'}`:'Choose ingredients to find matching recipes'}</small></span><span aria-hidden="true">❯</span></button>${selectedFoods.size?`<div class="chosen">${[...selectedFoods].map(s=>`<span>${esc(foodName(s))}</span>`).join('')}</div>`:''}<div class="between"><strong>My collection</strong><span class="tiny">${recipes.length} recipes</span></div><div class="chips">${categories().map(c=>`<button class="chip ${filter===c?'active':''}" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div>${resultsMarkup()}`}
function form(){let r=recipes.find(x=>x.id===editing)||{};return `<button class="topback" data-action="back">← Back</button><h1 class="hero">${editing?'Edit recipe':'Add a recipe'}</h1><p class="muted">Keep your favorite recipes in one cozy place.</p><section class="importbox" aria-label="Recipe photo scanner"><h3>📸 Scan a recipe</h3><p class="muted">Photograph a cookbook page once, then select each text area with your finger. Reuse the same photo for title, ingredients and instructions.</p><div class="scan-actions"><label>📷 Take photo<input id="scanCamera" type="file" accept="image/*" capture="environment"></label><label>🖼️ Choose photo<input id="scanGallery" type="file" accept="image/*"></label></div><div id="scanStage" class="scan-stage hidden"><img id="scanImage" alt="Recipe page to crop"><div id="scanRect" class="scan-rect hidden"></div></div><div class="scan-targets"><button type="button" data-scan-target="TITLE" class="active">Title</button><button type="button" data-scan-target="INGREDIENTS">Ingredients</button><button type="button" data-scan-target="INSTRUCTIONS">Instructions</button></div><p class="scan-help">Drag a rectangle around the selected section of the photo. Select only one column at a time. For long instructions, scan several sections consecutively.</p><div class="formrow"><label for="ocrLanguage">Text language</label><select class="field" id="ocrLanguage"><option value="deu" selected>German</option><option value="deu+eng">German + English</option><option value="eng">English</option></select></div><button type="button" class="primary scan-ocr-button" id="scanRead" disabled>Read selected area</button><div id="ocrStatus" class="ocrprogress" role="status"></div><div class="formrow"><label for="importText">Recognized text (editable)</label><textarea id="importText" class="field" placeholder="Scanned text appears here. You can also paste an Instagram caption."></textarea></div><button type="button" class="secondary" id="parseImport">Fill recipe fields from text</button><p class="hint">The OCR runs on your device; an internet connection is needed to load recognition data. Always check quantities and instructions. Handwriting may not be recognized accurately.</p></section><form id="recipeForm"><div class="formrow"><label for="url">Instagram or original recipe link</label><input class="field" type="url" id="url" placeholder="https://www.instagram.com/reel/..." value="${esc(r.url||'')}"><div class="hint">Links are saved; Instagram videos are not automatically analyzed yet.</div></div><div class="formrow"><label for="title">Recipe name *</label><input class="field" id="title" required maxlength="160" value="${esc(r.title||'')}" placeholder="e.g. Creamy tomato pasta"></div><div class="formrow"><label for="category">Category</label><select class="field" id="category">${CATS.map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="formrow"><label for="time">Time</label><input class="field" id="time" maxlength="50" value="${esc(r.time||'')}" placeholder="e.g. 30 min"></div><div class="formrow"><label for="servings">Servings</label><input class="field" id="servings" maxlength="40" value="${esc(r.servings||'')}" placeholder="e.g. 4"></div><div class="formrow"><label for="ingredients">Ingredients (one per line)</label><textarea class="field" id="ingredients" placeholder="200 g flour&#10;2 eggs&#10;100 ml milk">${esc((r.ingredients||[]).join('\n'))}</textarea></div><div class="formrow"><label for="instructions">Instructions (one step per line)</label><textarea class="field" id="instructions" placeholder="Mix the ingredients&#10;Bake for 20 minutes">${esc((r.steps||[]).join('\n'))}</textarea></div><div class="formrow"><label for="tags">Tags (comma-separated)</label><input class="field" id="tags" value="${esc(r.tags||'')}" placeholder="quick, vegetarian, comfort food"></div><div class="formrow"><label for="coverFile">Cover photo (optional)</label><input class="field file" type="file" id="coverFile" accept="image/*"><div class="hint">Choose a photo or Instagram screenshot from your camera roll. Crumb compresses it on your device.</div><img id="coverPreview" class="cover-preview ${r.image?'':'hidden'}" src="${esc(r.image||'')}" alt="Recipe cover preview"><div class="cover-tools"><button type="button" class="secondary small ${r.image?'':'hidden'}" id="removeCover">Remove photo</button><span class="hint" id="coverStatus"></span></div></div><div class="formrow"><label for="status">Cooking status</label><select class="field" id="status"><option value="try" ${r.status!=='made'?'selected':''}>Want to try</option><option value="made" ${r.status==='made'?'selected':''}>Made it</option></select></div><div class="save-row"><button class="primary" type="submit">${editing?'Save changes':'Save recipe'}</button></div></form>`}
function details(){let r=recipes.find(x=>x.id===detail);if(!r)return home();return `<button class="topback" data-action="back">← Back to recipes</button><div class="panel"><div class="eyebrow">${esc(r.category)}</div><h1 class="hero">${esc(r.title)}</h1><p class="muted">◷ ${esc(r.time||'Time not set')} · ${esc(r.servings||'Servings not set')}</p><span class="status">${r.status==='made'?'✓ Made it':'Want to try'}</span>${r.image?`<p><img src="${esc(r.image)}" alt="${esc(r.title)}" style="width:100%;max-height:320px;object-fit:cover;border-radius:14px"></p>`:''}<hr class="divider"><h2>Ingredients</h2>${r.ingredients.length?`<ul class="ingredients">${r.ingredients.map(s=>`<li><label><input type="checkbox">${esc(s)}</label></li>`).join('')}</ul>`:'<p class="muted">No ingredients added.</p>'}<hr class="divider"><h2>Instructions</h2>${r.steps.length?`<ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'<p class="muted">No instructions added.</p>'}${r.tags?`<p class="tiny">Tags: ${esc(r.tags)}</p>`:''}${r.url?`<p><a class="secondary" style="display:inline-block;text-decoration:none" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open original recipe ↗</a></p>`:''}<hr class="divider"><div class="actions"><button class="primary" data-action="edit" data-id="${esc(r.id)}">Edit</button><button class="secondary" data-action="status" data-id="${esc(r.id)}">${r.status==='made'?'Mark Want to try':'Mark Made it'}</button><button class="secondary" data-action="favorite" data-id="${esc(r.id)}">${r.favorite?'♥ Favorite':'♡ Favorite'}</button><button class="danger" data-action="delete" data-id="${esc(r.id)}">Delete</button></div></div>`}
function settings(){return `<h1 class="hero">Your recipe book</h1><p class="muted">Your recipes live in this browser on this device. Export backups regularly, especially before clearing Safari data or changing phones.</p><div class="panel"><h2>Backup & restore</h2><p class="muted">Export all recipes to a JSON file. You can import it later on this or another device.</p><button class="primary" id="export">Export recipes</button><div class="formrow"><label for="import">Import a backup</label><input class="field file" type="file" accept="application/json,.json" id="import"></div><p class="hint">Import adds recipes from the file and updates recipes with matching IDs. Keep your backup file private.</p></div><div class="panel"><h2>Install Crumb</h2><p class="muted">On iPhone, open the deployed website in Safari, tap Share, then Add to Home Screen.</p><p class="hint">For offline loading, the site must be served over HTTPS and the service worker must have been installed successfully.</p></div><div class="panel"><h2>About</h2><p class="muted">Crumb 1.3.2 · Free, local-first recipe organizer. No account and no AI API required.</p></div>`}

 const stepsHeader=/^(?:zubereitung|anleitung|zubereitungsschritte|instructions?|directions?|method|preparation|steps?|how to make(?: it)?|recipe|let(?:'|’)s (?:make|cook|bake)(?: it)?)\s*:?\s*$/i;
 const quantity=/^(?:[-•*]\s*)?(?:(?:\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?|\d+\s*\/\s*\d+|[¼½¾⅓⅔⅛])\s*(?:g|kg|mg|ml|l|cups?|tbsp|tsp|tablespoons?|teaspoons?|oz|lb|lbs|cloves?|pinch(?:es)?|handfuls?|pieces?|pcs?|cans?|packets?|sticks?|slices?|large|medium|small|eggs?)?\b|(?:salt|pepper|olive oil|water|butter|flour|sugar)\s+to taste\b)/i;
 const stepLike=/^(?:step\s*\d+[:.)-]?\s*|\d+[.)]\s+|[-•*]\s*)?(?:preheat|mix|stir|combine|add|bake|cook|heat|chop|slice|whisk|pour|serve|fold|knead|let |leave |place|transfer|blend|bring |simmer|boil|fry|roast|spread|roll|drain|season|remove|set |beat |melt|cover|refrigerate|peel|wash|cut |mischen|verrühren|verruehren|backen|kochen|erhitzen|schneiden|zugeben|hinzufügen|hinzufugen|kneten|servieren|anbraten|braten|rühren|ruehren|unterheben|vorheizen|vermengen|schlagen|schmelzen|abdecken|waschen|schälen|schaelen)/i;
 let mode='',ings=[],steps=[],other=[];
 for(const original of lines){
  const line=original.replace(/^[-•*]\s*/,'').trim();
  if(ingredientHeader.test(line)){mode='ingredients';continue}
  if(stepsHeader.test(line)){mode='steps';continue}
  if(/^#|^https?:\/\//i.test(line))continue;
  if(mode==='ingredients'&&stepLike.test(line))mode='steps';
  if(mode==='steps')steps.push(line.replace(/^(?:step\s*)?\d+[.)-]\s*/i,''));
  else if(mode==='ingredients')ings.push(line);
  else if(quantity.test(line)&&!stepLike.test(line))ings.push(line);
  else if(stepLike.test(line)||/^\d+[.)]\s+/.test(original))steps.push(line.replace(/^\d+[.)]\s*/,'')); 
  else other.push(line);
 }
 if(!ings.length&&!steps.length)return toast('No clear ingredients or steps found. You can edit the text manually.');
 if(ings.length){$('ingredients').value=[...new Set(ings)].join('\n')}
 if(steps.length){$('instructions').value=steps.join('\n')}
 if(!$('time').value.trim()){const tm=raw.match(/(?:prep(?:aration)? time|cook(?:ing)? time|total time|zeit|dauer|zubereitungszeit)\s*:?\s*(\d+\s*(?:min(?:utes?|uten)?|h(?:ours?|ours?)?|stunden?))/i);if(tm)$('time').value=tm[1]}if(!$('servings').value.trim()){const sm=raw.match(/(?:serves|servings|portions?|portionen|personen)\s*:?\s*(\d+)/i);if(sm)$('servings').value=sm[1]}if(!$('title').value.trim()){
  const possible=other.find(x=>x.length>=4&&x.length<=85&&!/^(save|follow|comment|like|share|recipe in bio|serves|prep time|cook time)/i.test(x));
  if(possible)$('title').value=possible.replace(/^#+\s*/,'');
 }
 $('ocrStatus').textContent=`Suggested ${ings.length} ingredient line(s) and ${steps.length} step(s). Review all fields carefully, especially handwriting and multi-column layouts.`;
 toast('Recipe fields filled — please review!');
 $('title').scrollIntoView({behavior:'smooth',block:'center'});
}

document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}let tab=e.target.closest('[data-ingredient-tab]');if(tab){ingredientTab=tab.dataset.ingredientTab;foodGroup='All';render();return}let group=e.target.closest('[data-food-group]');if(group){foodGroup=group.dataset.foodGroup;render();return}let food=e.target.closest('[data-food]');if(food){const set=ingredientTab==='staples'?pantryStaples:selectedFoods;set.has(food.dataset.food)?set.delete(food.dataset.food):set.add(food.dataset.food);savePantry();drawFoodTiles();return}let a=e.target.closest('[data-action]');if(!a)return;let id=a.dataset.id,r=recipes.find(x=>x.id===id);switch(a.dataset.action){case'ingredients':view='ingredients';ingredientTab='ingredients';foodGroup='All';render();break;case'doneIngredients':view='home';render();break;case'resetIngredients':if(ingredientTab==='staples')pantryStaples=new Set(['salt','pepper','oil','water']);else selectedFoods.clear();savePantry();render();break;case'open':detail=id;view='detail';render();window.scrollTo(0,0);break;case'back':navigate('home');break;case'edit':editing=id;view='add';render();break;case'favorite':if(r){r.favorite=!r.favorite;persist();render()}break;case'status':if(r){r.status=r.status==='made'?'try':'made';persist();render()}break;case'delete':if(r&&confirm('Delete this recipe permanently?')){recipes=recipes.filter(x=>x.id!==id);persist();navigate('home');toast('Recipe deleted')}break}});document.addEventListener('change',e=>{if(e.target.id==='flexible'){flexibleMatch=e.target.checked;savePantry();drawFoodTiles()}});load();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
